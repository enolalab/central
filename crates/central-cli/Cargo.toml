[package]
name = "central-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "central"
path = "src/main.rs"

[dependencies]
central-domain = { path = "../central-domain" }
central-application = { path = "../central-application" }
central-infrastructure = { path = "../central-infrastructure" }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4"] }
