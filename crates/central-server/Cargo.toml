[package]
name = "central-server"
version = "0.1.0"
edition = "2021"

[features]
test-support = []

[dependencies]
central-domain = { path = "../central-domain" }
central-application = { path = "../central-application" }
central-infrastructure = { path = "../central-infrastructure" }
async-trait = "0.1"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
central-server = { path = ".", features = ["test-support"] }
central-domain = { path = "../central-domain" }
serde_json = "1.0.154"
