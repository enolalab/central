[package]
name = "central-infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
central-domain = { path = "../central-domain" }
central-application = { path = "../central-application" }
async-trait = "0.1"
duckdb = { version = "=1.20000.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
