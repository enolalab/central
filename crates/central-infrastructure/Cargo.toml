[package]
name = "central-infrastructure"
version = "0.1.0"
edition = "2021"

[features]
# Enables test-only failure injection. Production builds (the daemon)
# must not be able to reach `inject_commit_failure`.
test-support = []

[dependencies]
central-domain = { path = "../central-domain" }
central-application = { path = "../central-application" }
async-trait = "0.1"
duckdb = { version = "=1.20000.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "rt", "io-util", "time"] }
uuid = { version = "1.29.2", features = ["v4"] }
fs2 = "0.4.3"

[dev-dependencies]
central-infrastructure = { path = ".", features = ["test-support"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
